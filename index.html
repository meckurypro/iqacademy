<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Until the script below runs, follow the phone's own light/dark setting; the script then leaves one tag, for the theme in use.
         (iOS 26 Safari ignores this tag and tints its bars from the page instead: see the fixed header, tab bar and BarCaps in App.tsx.) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0b08" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* First paint, before the stylesheet arrives: the page behind and under the system bars is already the right colour (no white flash in dark). Keep in step with --bg in index.css. */
      html { background: #faf9f6 } html[data-theme="dark"] { background: #0d0b08 }
    </style>
    <title>IQ Academy</title>
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="1000x1000" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try { var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var d = document.documentElement; d.dataset.theme = t; d.style.colorScheme = t;
        var m = document.querySelectorAll('meta[name="theme-color"]');
        m[0].setAttribute("content", t === "dark" ? "#0d0b08" : "#faf9f6"); m[0].removeAttribute("media");
        for (var i = 1; i < m.length; i++) m[i].remove(); } catch (e) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
